<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 할 일</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#3b82f6">
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1d2129;--sub:#6b7280;--line:#e5e7eb;--accent:#3b82f6;--late:#ef4444}
  @media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2128;--text:#eceef2;--sub:#9aa1ad;--line:#2d323b;--accent:#60a5fa;--late:#f87171}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 80px}
  h1{font-size:22px;margin:8px 0 2px}
  .date{color:var(--sub);font-size:14px;margin-bottom:16px}
  form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);padding:12px;border-radius:12px;margin-bottom:20px}
  form input[type=text]{grid-column:1/3}
  input,select,button{font:inherit;color:inherit}
  input,select{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0}
  form button{grid-column:1/3;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
  h2{font-size:14px;color:var(--sub);margin:22px 0 8px;font-weight:600}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  li{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px;border-radius:12px;animation:in .25s}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}}
  li.out{opacity:0;transform:translateX(30px);transition:.25s}
  .check{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:none;cursor:pointer;flex:none;font-size:15px;color:var(--accent);line-height:1}
  .check:hover{background:var(--accent);color:#fff}
  .info{flex:1;min-width:0}
  .title{word-break:break-all}
  .meta{font-size:12px;color:var(--sub);margin-top:2px}
  .late .meta{color:var(--late)}
  .del{border:0;background:none;color:var(--sub);cursor:pointer;font-size:18px;padding:4px}
  .upcoming li{opacity:.7}
  .empty{text-align:center;color:var(--sub);padding:28px 0;background:var(--card);border-radius:12px}
  #notif{font-size:12px;color:var(--sub);background:none;border:0;text-decoration:underline;cursor:pointer;margin-top:18px}
</style>
</head>
<body>
<main>
  <h1>오늘 할 일</h1>
  <div class="date" id="today"></div>

  <form id="f">
    <input type="text" id="title" placeholder="할 일 입력" required maxlength="100">
    <input type="date" id="date">
    <input type="time" id="time">
    <select id="repeat" style="grid-column:1/3">
      <option value="none">반복 안 함</option>
      <option value="daily">매일</option>
      <option value="weekdays">평일(월~금)</option>
      <option value="weekly">매주 같은 요일</option>
    </select>
    <button>추가</button>
  </form>

  <h2>지금 해야 할 일</h2>
  <ul id="due"></ul>

  <h2>오늘 예정 · 앞으로의 일정</h2>
  <ul id="upcoming" class="upcoming"></ul>

  <button id="notif" hidden>시간이 되면 알림 받기</button>
</main>

<script>
const KEY = 'todo-by-time-v1';
const $ = id => document.getElementById(id);
let tasks = [];
try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e) {} };

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const at = (dateStr, time) => new Date(`${dateStr}T${time || '00:00'}:00`);
const DAYS = ['일','월','화','수','목','금','토'];

// 해당 날짜에 이 할 일이 발생하는지
function occursOn(t, dateStr){
  if (dateStr < t.date) return false;
  const dow = at(dateStr).getDay();
  switch (t.repeat){
    case 'daily': return true;
    case 'weekdays': return dow >= 1 && dow <= 5;
    case 'weekly': return dow === at(t.date).getDay();
    default: return dateStr === t.date;
  }
}

// 현재 시점의 "발생 인스턴스" 계산
function compute(now){
  const today = ymd(now), due = [], upcoming = [];
  for (const t of tasks){
    if (t.repeat === 'none'){
      if (t.done) continue;
      const when = at(t.date, t.time);
      (when <= now ? due : upcoming).push({t, when, day: t.date});
    } else {
      // 반복: 오늘 분만 노출 (밀린 반복 일정은 쌓이지 않음)
      if (occursOn(t, today) && !(t.doneDates||[]).includes(today)){
        const when = at(today, t.time);
        (when <= now ? due : upcoming).push({t, when, day: today});
      } else {
        // 다음 발생일을 미리보기로
        for (let i=1;i<=7;i++){
          const d = new Date(now); d.setDate(d.getDate()+i);
          const ds = ymd(d);
          if (occursOn(t, ds)){ upcoming.push({t, when: at(ds, t.time), day: ds}); break; }
        }
      }
    }
  }
  const byWhen = (a,b)=>a.when-b.when;
  return {due: due.sort(byWhen), upcoming: upcoming.sort(byWhen)};
}

const REPEAT_LABEL = {daily:'매일', weekdays:'평일', weekly:'매주', none:''};
function label(item, now){
  const {t, day} = item, today = ymd(now);
  let s = day === today ? '오늘' : `${Number(day.slice(5,7))}/${Number(day.slice(8))} (${DAYS[at(day).getDay()]})`;
  if (t.time) s += ' ' + t.time;
  if (t.repeat !== 'none') s += ' · ' + REPEAT_LABEL[t.repeat];
  return s;
}

function row(item, now, isDue){
  const li = document.createElement('li');
  if (isDue && ymd(item.when) < ymd(now)) li.className = 'late';
  const late = isDue && ymd(item.when) < ymd(now);
  li.innerHTML = `
    ${isDue ? '<button class="check" title="완료">✓</button>' : ''}
    <div class="info"><div class="title"></div><div class="meta"></div></div>
    <button class="del" title="삭제">×</button>`;
  li.querySelector('.title').textContent = item.t.title;
  li.querySelector('.meta').textContent = (late ? '밀린 일정 · ' : '') + label(item, now);
  const chk = li.querySelector('.check');
  if (chk) chk.onclick = () => {
    li.classList.add('out');
    setTimeout(() => {
      if (item.t.repeat === 'none') item.t.done = true;
      else (item.t.doneDates = item.t.doneDates || []).push(item.day);
      save(); render();
    }, 220);
  };
  li.querySelector('.del').onclick = () => {
    if (!confirm('이 일정을 삭제할까요?' + (item.t.repeat !== 'none' ? '\n(반복 일정 전체가 삭제됩니다)' : ''))) return;
    tasks = tasks.filter(x => x !== item.t); save(); render();
  };
  return li;
}

const notified = new Set();
function render(){
  const now = new Date();
  $('today').textContent = `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${DAYS[now.getDay()]}) ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const {due, upcoming} = compute(now);
  const d = $('due'), u = $('upcoming');
  d.replaceChildren(); u.replaceChildren();
  if (!due.length){
    const e = document.createElement('div'); e.className='empty';
    e.textContent = '지금 해야 할 일이 없어요 🎉'; d.append(e);
  }
  due.forEach(i => d.append(row(i, now, true)));
  upcoming.forEach(i => u.append(row(i, now, false)));

  // 시간이 된 일정 알림 (새로 나타난 것만)
  if ('Notification' in window && Notification.permission === 'granted'){
    for (const i of due){
      const k = i.t.id + i.day;
      if (!notified.has(k) && now - i.when < 5*60*1000){ new Notification('할 일', {body: i.t.title}); }
      notified.add(k);
    }
  }
}

$('f').onsubmit = e => {
  e.preventDefault();
  tasks.push({
    id: Date.now().toString(36),
    title: $('title').value.trim(),
    date: $('date').value || ymd(new Date()),
    time: $('time').value,
    repeat: $('repeat').value,
    done: false, doneDates: []
  });
  $('title').value = ''; $('time').value = '';
  save(); render();
};

$('date').value = ymd(new Date());
if ('Notification' in window && Notification.permission === 'default'){
  $('notif').hidden = false;
  $('notif').onclick = () => Notification.requestPermission().then(()=>{ $('notif').hidden = true; });
}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
render();
setInterval(render, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
</script>
</body>
</html>
